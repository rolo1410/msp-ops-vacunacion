[settings]
title = "Sistema de Vacunación MSP"
description = "Sistema de análisis y control de vacunación del Ministerio de Salud Pública"
version = "1.0.0"

[server]
port = 8501
enableCORS = false
maxUploadSize = 200

[theme]
# Tema Oscuro Moderno
primaryColor = "#FF6B6B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"