[settings]
title = "Sistema de Vacunación MSP"
description = "Sistema de análisis y control de vacunación del Ministerio de Salud Pública"
version = "1.0.0"

[server]
port = 8501
enableCORS = false
maxUploadSize = 200

[theme]
# Tema Light Moderno
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"